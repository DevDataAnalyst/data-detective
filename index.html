<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Learn to describe data with short lessons, then solve a real data mission in Python."
    />
    <title>Data Detective · learning prototype</title>
    <script>
      // Apply the saved theme before the first paint, so dark mode never flashes white. The same
      // rule lives in src/storage/theme.ts, which takes over once the app loads.
      (function () {
        try {
          var saved = localStorage.getItem('data-detective:theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#231a14');
          }
        } catch (error) {
          // Storage or media queries unavailable: stay light until the app decides.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
